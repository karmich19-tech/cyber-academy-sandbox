<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Academy Python IDE</title>

  <script src="https://cdn.jsdelivr.net/pyodide/v0.29.0/full/pyodide.js"></script>

  <style>
    :root {
      --navy: #10283f;
      --blue: #2874a6;
      --light-blue: #eaf4fb;
      --border: #c8d3dc;
      --console: #101820;
      --console-text: #e8f3f8;
      --danger: #b42318;
      --success: #147a3d;
      --warning: #8a5b00;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 18px;
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #17202a;
    }

    .sandbox {
      max-width: 1200px;
      margin: 0 auto;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      background: #ffffff;
      box-shadow: 0 3px 14px rgba(0,0,0,0.08);
    }

    .header {
      padding: 18px 20px;
      background: var(--navy);
      color: #ffffff;
    }

    .header h1 {
      margin: 0 0 5px;
      font-size: 24px;
    }

    .header p {
      margin: 0;
      line-height: 1.45;
    }

    .instructions {
      padding: 14px 20px;
      background: var(--light-blue);
      border-bottom: 1px solid var(--border);
      line-height: 1.55;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      padding: 12px 16px;
      background: #f7f9fb;
      border-bottom: 1px solid var(--border);
    }

    button {
      border: 0;
      border-radius: 6px;
      padding: 10px 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    #runButton { background: var(--success); color: #ffffff; }
    #resetButton, #clearButton { background: #dfe6eb; color: #17202a; }
    #hintButton { background: #f2c94c; color: #17202a; }
    #checkButton { background: var(--blue); color: #ffffff; }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    #status {
      margin-left: auto;
      font-size: 14px;
      font-weight: 700;
    }

    .feedback {
      display: none;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      line-height: 1.45;
      font-weight: 700;
    }

    .feedback.success {
      display: block;
      background: #e9f7ef;
      color: var(--success);
    }

    .feedback.warning {
      display: block;
      background: #fff7e0;
      color: var(--warning);
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 3fr) minmax(280px, 2fr);
      min-height: 560px;
    }

    .panel { min-width: 0; }

    .panel-title {
      padding: 10px 14px;
      background: #eef2f5;
      border-bottom: 1px solid var(--border);
      font-weight: 700;
    }

    .editor-panel {
      border-right: 1px solid var(--border);
    }

    .editor-wrap {
      display: grid;
      grid-template-columns: 52px minmax(0, 1fr);
      height: 510px;
      overflow: hidden;
      background: #ffffff;
    }

    #lineNumbers {
      margin: 0;
      padding: 14px 10px 14px 0;
      overflow: hidden;
      text-align: right;
      user-select: none;
      color: #6b7780;
      background: #f4f6f8;
      border-right: 1px solid #dfe5e9;
      font: 15px/1.55 Consolas, "Courier New", monospace;
      white-space: pre;
    }

   #codeEditor {
      width: 100%;
      height: 100%;
      resize: none;
      border: 0;
      outline: none;
      padding: 14px;
      tab-size: 4;
      color: #17202a;
      background: #ffffff;
      font: 15px/1.55 Consolas, "Courier New", monospace;
-     white-space: pre;
-     overflow: auto;
+     white-space: pre-wrap;
+     word-break: break-word;
+     overflow-y: auto;
+     overflow-x: hidden;
  }

    #console {
      height: 510px;
      margin: 0;
      padding: 14px;
      overflow: auto;
      color: var(--console-text);
      background: var(--console);
      font: 15px/1.55 Consolas, "Courier New", monospace;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .note {
      padding: 10px 16px;
      border-top: 1px solid var(--border);
      color: #52616b;
      background: #fafbfc;
      font-size: 13px;
      line-height: 1.45;
    }

    @media (max-width: 820px) {
      .workspace { grid-template-columns: 1fr; }
      .editor-panel {
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }
      #status {
        width: 100%;
        margin-left: 0;
      }
    }
  </style>
</head>

<body>
  <main class="sandbox">
    <header class="header">
      <h1 id="lessonTitle">Loading lesson…</h1>
      <p id="lessonSubtitle"></p>
    </header>

    <section class="instructions" id="lessonInstructions">
      Loading mission instructions…
    </section>

    <div class="toolbar">
      <button id="runButton" type="button" disabled>▶ Run Code</button>
      <button id="checkButton" type="button">✓ Check My Code</button>
      <button id="hintButton" type="button">💡 Hint</button>
      <button id="resetButton" type="button">↺ Reset Code</button>
      <button id="clearButton" type="button">Clear Output</button>
      <span id="status">Loading lesson…</span>
    </div>

    <div id="feedback" class="feedback"></div>

    <section class="workspace">
      <div class="panel editor-panel">
        <div class="panel-title">Python editor</div>
        <div class="editor-wrap">
          <pre id="lineNumbers" aria-hidden="true">1</pre>
          <textarea id="codeEditor" spellcheck="false" aria-label="Python code editor"></textarea>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">Program output</div>
        <pre id="console">Loading lesson…</pre>
      </div>
    </section>

    <div class="note">
      Student work is not saved automatically. Copy completed code before leaving the page if it must be submitted.
    </div>
  </main>

  <script>
    const editor = document.getElementById("codeEditor");
    const lineNumbers = document.getElementById("lineNumbers");
    const consoleOutput = document.getElementById("console");
    const runButton = document.getElementById("runButton");
    const resetButton = document.getElementById("resetButton");
    const clearButton = document.getElementById("clearButton");
    const hintButton = document.getElementById("hintButton");
    const checkButton = document.getElementById("checkButton");
    const statusText = document.getElementById("status");
    const feedback = document.getElementById("feedback");

    let pyodide = null;
    let lesson = null;
    let hintIndex = 0;

    function getLessonName() {
      const params = new URLSearchParams(window.location.search);
      return params.get("lesson") || "week5-lesson2";
    }

    async function loadLesson() {
      const lessonName = getLessonName();
      const response = await fetch(`lessons/${lessonName}.json`, { cache: "no-store" });

      if (!response.ok) {
        throw new Error(`Could not load lessons/${lessonName}.json`);
      }

      lesson = await response.json();

      document.title = lesson.title + " | Cyber Academy";
      document.getElementById("lessonTitle").textContent = lesson.title;
      document.getElementById("lessonSubtitle").textContent = lesson.subtitle || "";
      document.getElementById("lessonInstructions").innerHTML = lesson.instructions;
      editor.value = lesson.starterCode;
      updateLineNumbers();
      clearOutput("Lesson loaded. Python is now loading…\n");
      statusText.textContent = "Loading Python…";
    }

    function updateLineNumbers() {
      const count = editor.value.split("\n").length;
      lineNumbers.textContent = Array.from(
        { length: count },
        (_, index) => index + 1
      ).join("\n");
    }

    function appendOutput(text) {
      consoleOutput.textContent += String(text);
      consoleOutput.scrollTop = consoleOutput.scrollHeight;
    }

    function clearOutput(message = "") {
      consoleOutput.textContent = message;
    }

    function showFeedback(message, type) {
      feedback.textContent = message;
      feedback.className = `feedback ${type}`;
    }

    function hideFeedback() {
      feedback.textContent = "";
      feedback.className = "feedback";
    }

    editor.addEventListener("input", () => {
      updateLineNumbers();
      hideFeedback();
    });

    editor.addEventListener("scroll", () => {
      lineNumbers.scrollTop = editor.scrollTop;
    });

    editor.addEventListener("keydown", (event) => {
      if (event.key === "Tab") {
        event.preventDefault();
        const start = editor.selectionStart;
        const end = editor.selectionEnd;
        editor.value =
          editor.value.substring(0, start) +
          "    " +
          editor.value.substring(end);
        editor.selectionStart = editor.selectionEnd = start + 4;
        updateLineNumbers();
      }
    });

    resetButton.addEventListener("click", () => {
      if (!lesson) return;
      editor.value = lesson.starterCode;
      hintIndex = 0;
      updateLineNumbers();
      hideFeedback();
      clearOutput("Starter code restored.\n");
      editor.focus();
    });

    clearButton.addEventListener("click", () => clearOutput(""));

    hintButton.addEventListener("click", () => {
      if (!lesson || !lesson.hints || lesson.hints.length === 0) {
        showFeedback("No hints are available for this mission.", "warning");
        return;
      }

      const hint = lesson.hints[Math.min(hintIndex, lesson.hints.length - 1)];
      showFeedback(`Hint ${Math.min(hintIndex + 1, lesson.hints.length)}: ${hint}`, "warning");

      if (hintIndex < lesson.hints.length - 1) {
        hintIndex += 1;
      }
    });

    checkButton.addEventListener("click", () => {
      if (!lesson) return;

      const code = editor.value;
      const missing = [];

      if (code.includes("???")) {
        missing.push("Replace every ???.");
      }

      for (const check of lesson.codeChecks || []) {
        if (!code.includes(check.contains)) {
          missing.push(check.message);
        }
      }

      if (missing.length === 0) {
        showFeedback(
          lesson.successMessage || "Your code includes the required parts. Run it and test both successful and unsuccessful inputs.",
          "success"
        );
      } else {
        showFeedback(missing.join(" "), "warning");
      }
    });

    async function initialisePython() {
      try {
        pyodide = await loadPyodide({
          indexURL: "https://cdn.jsdelivr.net/pyodide/v0.29.0/full/"
        });

        pyodide.setStdout({
          batched: (text) => appendOutput(text + "\n")
        });

        pyodide.setStderr({
          batched: (text) => appendOutput(text + "\n")
        });

        statusText.textContent = "Python ready";
        statusText.style.color = "#147a3d";
        runButton.disabled = false;
        clearOutput("Python is ready. Edit the code and select Run Code.\n");
      } catch (error) {
        statusText.textContent = "Python failed to load";
        statusText.style.color = "#b42318";
        clearOutput(
          "Python could not load.\n\nCheck the internet connection or open the activity in a new tab.\n\n" +
          String(error)
        );
      }
    }

    runButton.addEventListener("click", async () => {
      if (!pyodide) {
        clearOutput("Python is still loading. Please wait.\n");
        return;
      }

      runButton.disabled = true;
      statusText.textContent = "Running…";
      statusText.style.color = "#17202a";
      clearOutput("");

      const inputSetup = `
import builtins
from js import window

def _browser_input(message=""):
    answer = window.prompt(str(message))
    if answer is None:
        raise KeyboardInterrupt("Input cancelled by user")
    return str(answer)

builtins.input = _browser_input
`;

      try {
        await pyodide.runPythonAsync(inputSetup);
        await pyodide.loadPackagesFromImports(editor.value);
        await pyodide.runPythonAsync(editor.value);

        if (!consoleOutput.textContent.trim()) {
          appendOutput("Program finished with no printed output.\n");
        }

        statusText.textContent = "Run complete";
        statusText.style.color = "#147a3d";
      } catch (error) {
        appendOutput("\n" + String(error) + "\n");
        statusText.textContent = "Check the error";
        statusText.style.color = "#b42318";
      } finally {
        runButton.disabled = false;
      }
    });

    (async () => {
      try {
        await loadLesson();
        await initialisePython();
      } catch (error) {
        statusText.textContent = "Lesson failed to load";
        statusText.style.color = "#b42318";
        clearOutput(String(error));
      }
    })();
  </script>
</body>
</html>
